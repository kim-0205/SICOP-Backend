
# Publicación Docker de SICOP Backend
name: CD - SICOP Backend

# Publicar únicamente cuando se actualice main
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest

    steps:
      # Descargar nuestro proyecto
      - name: Obtener código
        uses: actions/checkout@v6

      # Preparar Docker Buildx
      - name: Configurar Docker
        uses: docker/setup-buildx-action@v4

      # Autenticarnos en GHCR
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construir y publicar la imagen
      - name: Construir y publicar Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/kim-0205/sicop-backend:latest
            ghcr.io/kim-0205/sicop-backend:${{ github.sha }}

  # NUEVO: Actualizar SQL Server después de publicar Docker
  migraciones:
    name: Aplicar migraciones a MonsterASP.NET
    runs-on: ubuntu-latest
    needs: docker

    steps:
      # Descargar nuestro proyecto
      - name: Obtener código
        uses: actions/checkout@v6

      # Preparar .NET 10
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      # Restaurar paquetes NuGet
      - name: Restaurar paquetes NuGet
        run: dotnet restore SICOP.csproj    

      # Instalar Entity Framework Core
      - name: Instalar EF Core
        run: dotnet tool install --global dotnet-ef --version '10.*'

      # Aplicar migraciones pendientes a SQL Server remoto
      - name: Ejecutar migraciones
        env:
          SICOP_SQL_CONNECTION: ${{ secrets.SICOP_SQL_CONNECTION }}
        run: dotnet ef database update --connection "$SICOP_SQL_CONNECTION"
        
    
  # NUEVO: Desplegar automáticamente en OpenShift
  desplegar:
    name: Actualizar Backend en OpenShift
    runs-on: ubuntu-latest
    needs: [docker, migraciones]

    steps:
      # Instalar herramientas de OpenShift
      - name: Instalar OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4'

      # Autenticarse mediante el token de GitHub Secrets
      - name: Conectar con OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN_BACKEND }}
          namespace: sicop-dev-dev

      # Actualizar la imagen Docker publicada en GHCR
      - name: Actualizar contenedor Backend
        run: |
          oc set image deployment/sicop-backend sicop-backend=ghcr.io/kim-0205/sicop-backend:${{ github.sha }} -n sicop-dev-dev
          oc rollout status deployment/sicop-backend -n sicop-dev-dev --timeout=180s

